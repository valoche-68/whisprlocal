name: Prepare a Linux release for human publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          test ! -d .github/upstream-conflicts
          npm ci --ignore-scripts
          npm rebuild better-sqlite3 --runtime=node
          npm run typecheck
          node scripts/whisprlocal/checks.cjs
          npm run test:local
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libpipewire-0.3-dev libfuse2t64
      - run: node node_modules/electron/install.js && node node_modules/ffmpeg-static/install.js
      - run: npm run download:embedding-model -- --for-build
      - run: npm run build:linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: |
          cd dist
          sha256sum WhisprLocal-*-linux-x64.deb WhisprLocal-*-linux-x64.AppImage WhisprLocal-*-linux-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/WhisprLocal-*-linux-x64.deb
            dist/WhisprLocal-*-linux-x64.AppImage
            dist/WhisprLocal-*-linux-x64.tar.gz
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          file=$(find release -name 'WhisprLocal-*-linux-x64.deb' -printf '%f\n')
          version=${file#WhisprLocal-}; version=${version%-linux-x64.deb}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'Independent Linux x86_64 edition. Review the artifacts and checks before publishing this draft. See the repository for English and French documentation.\n' > notes.md
          gh release create "v$version" release/* --target "$COMMIT" --draft --title "WhisprLocal $version" --notes-file notes.md
