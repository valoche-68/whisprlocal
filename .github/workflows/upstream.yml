name: Review new OpenWhispr releases
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-migration
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/OpenWhispr/openwhispr/releases/latest > "$RUNNER_TEMP/release.json"
          node - <<'JS'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/release.json'));const old=require('./upstream.json');
          if(r.draft||r.prerelease||!/^v\d+\.\d+\.\d+$/.test(r.tag_name))process.exit(0);
          const newer=(a,b)=>{const x=a.replace(/^v/,'').split('.').map(Number),y=b.replace(/^v/,'').split('.').map(Number);for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i]}return false};
          const available = newer(r.tag_name,old.version);
          console.log(`OpenWhispr latest stable: ${r.tag_name}; integrated: ${old.tag}; migration ${available ? 'needed' : 'up to date'}`);
          if(available)fs.appendFileSync(process.env.GITHUB_OUTPUT,`tag=${r.tag_name}\n`);
          JS
  prepare:
    needs: discover
    if: needs.discover.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      conflicted: ${{ steps.merge.outputs.conflicted }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: |
          branch="upstream/$TAG"
          previous_pr=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=all -f base=main -f head="${GH_REPO%/*}:$branch" \
            --jq '.[0].number // empty')
          if [[ -n "$previous_pr" ]]; then
            echo "Migration pull request #$previous_pr already exists"
            echo 'pr_exists=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
          fi
      - id: merge
        if: steps.existing.outputs.pr_exists != 'true' && steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ needs.discover.outputs.tag }}
        run: |
          cp scripts/whisprlocal/prepare-upstream.cjs "$RUNNER_TEMP/prepare-upstream.cjs"
          git fetch https://github.com/OpenWhispr/openwhispr.git "refs/tags/$TAG:refs/tags/$TAG"
          node "$RUNNER_TEMP/prepare-upstream.cjs" "$TAG"
          git push origin "HEAD:refs/heads/upstream/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: pr
        if: steps.existing.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.discover.outputs.tag }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          EXISTING_BRANCH: ${{ steps.existing.outputs.exists }}
        run: |
          branch="upstream/$TAG"
          if [ "$EXISTING_BRANCH" = true ]; then
            printf 'Recovered a migration branch that had no pull request. Review its contents and any conflict report before marking this draft ready.\n' > "$RUNNER_TEMP/pr-body.md"
          elif [ "$CONFLICTED" = true ]; then
            printf 'Migration blocked by conflicts. See the report in this branch. No code was resolved automatically. Human review is required; publication is blocked.\n' > "$RUNNER_TEMP/pr-body.md"
          else
            printf 'Imports OpenWhispr %s while retaining the independent local edition. Automated checks run without publication credentials. Review the UI, offline behavior, GPU lifecycle, network policy and release artifacts before merging. No automatic merge or publication.\n' "$TAG" > "$RUNNER_TEMP/pr-body.md"
          fi
          url=$(gh pr create --repo "$GH_REPO" --base main --head "$branch" --draft --title "Review OpenWhispr $TAG migration" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
  test-import:
    needs: prepare
    if: needs.prepare.outputs.sha != '' && needs.prepare.outputs.pr != '' && needs.prepare.outputs.conflicted == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No publication credentials or write token are exposed to imported code.
      - run: npm ci --ignore-scripts && npm run apply:patches --if-present && npm rebuild better-sqlite3 --runtime=node
      - run: npm run typecheck && npm run build:renderer
      - run: node scripts/whisprlocal/checks.cjs && npm run test:local
  ready-for-review:
    needs: [prepare, test-import]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          head=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .head.sha)
          if [[ "$head" != "$SHA" ]]; then
            echo 'Migration branch changed during validation; review its new commit separately'
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/statuses/$SHA" -f state=success -f context=checks -f description='Imported code passed the local edition checks without publication credentials'
          gh pr ready "$PR"
